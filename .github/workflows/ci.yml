name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # validate e test rodam no motor local do Claude Code, sem chave de API nem tokens
      - run: npm install -g @anthropic-ai/claude-code
      - run: sh scripts/verificar.sh
