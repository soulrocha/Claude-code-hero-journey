<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 130 76" width="120" height="70"><title>Anão minerador / Dwarf miner</title><style>.eye{animation:blink 4.4s infinite}@keyframes blink{0%,94%,100%{opacity:1}96%{opacity:0}}.sweep{transform-box:view-box;transform-origin:82px 56px;animation:sweep 3.2s ease-in-out infinite}@keyframes sweep{50%{transform:rotate(-7deg)}}.mag{animation:mag 2.6s ease-in-out infinite}@keyframes mag{50%{transform:translateY(9px)}}.gearr{transform-box:fill-box;transform-origin:center;animation:gr 4s linear infinite}@keyframes gr{to{transform:rotate(360deg)}}.pick{transform-box:view-box;transform-origin:96px 66px;animation:pick 1.6s ease-in-out infinite}@keyframes pick{0%,100%{transform:rotate(-28deg)}45%{transform:rotate(22deg)}}.stamp{animation:stamp 2.6s ease-in-out infinite}@keyframes stamp{0%,30%,80%,100%{transform:translateY(-8px)}45%,60%{transform:none}}.page{transform-box:fill-box;transform-origin:left center;animation:page 2.2s ease-in-out infinite}@keyframes page{50%{transform:scaleX(-1)}}.brush{transform-box:view-box;transform-origin:100px 62px;animation:brush 1.6s ease-in-out infinite}@keyframes brush{50%{transform:rotate(-14deg)}}.bub{animation:bub 2.2s ease-in infinite;opacity:0}@keyframes bub{0%{opacity:0;transform:none}25%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}.glow{animation:glow 2.6s ease-in-out infinite}@keyframes glow{50%{opacity:.35}}.bobs{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-2px)}}.lid{transform-box:fill-box;transform-origin:center bottom;animation:lid 1.8s ease-in-out infinite}@keyframes lid{0%,60%,100%{transform:none}75%{transform:rotate(-10deg) translateY(-3px)}}.rune{animation:rune 3s ease-in-out infinite}@keyframes rune{50%{opacity:.25}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="bobs"><rect x="40" y="50" width="5.2" height="5.2" rx=".8" fill="#d97757"/><rect x="45" y="50" width="5.2" height="5.2" rx=".8" fill="#d97